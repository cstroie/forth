<html>
	<head>
		<title>JSForth</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
			#interpreter {
				width: 100%;
				height: 100%;
				position: absolute;
				left: 0;
				right: 0;
				top: 0;
				bottom: 0;
				background-color: black;
				color: green;
				font-family: monospace;
				font-size: 2rem;
				resize: none;
				spellcheck: false;
			}
			
			@media (max-width: 480px) {
				#interpreter {
					font-size: 2.5rem;
				}
			}
			
			@media (min-width: 481px) and (max-width: 768px) {
				#interpreter {
					font-size: 2.2rem;
				}
			}
		</style>
		<script src="jsforth.js"></script>
	</head>
	<body>
		<textarea id="interpreter"></textarea>
	</body>
</html>
